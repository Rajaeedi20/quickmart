spring.application.name=user-service

server.port=8082

spring.datasource.url=${USER_DB_URL:jdbc:mysql://host.docker.internal:3306/quickmart_db?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:quickmart_app}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.error.include-message=always

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
spring.kafka.consumer.group-id=user-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:false}
app.kafka.payment-completed-topic=${PAYMENT_COMPLETED_TOPIC:payment.completed}
