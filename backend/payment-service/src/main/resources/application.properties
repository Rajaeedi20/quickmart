spring.application.name=payment-service

server.port=8083

spring.datasource.url=${PAYMENT_DB_URL:jdbc:mysql://host.docker.internal:3306/quickmart_payments?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:quickmart_app}
spring.datasource.password=${MYSQL_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.payment.mode=demo

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.payment-completed-topic=${PAYMENT_COMPLETED_TOPIC:payment.completed}
app.kafka.outbox-poll-ms=${PAYMENT_OUTBOX_POLL_MS:1000}
