
Quickmart DB design
===================

spring.application.name=product-service

server.port=8081

spring.datasource.url=${PRODUCT_DB_URL:jdbc:mysql://host.docker.internal:3306/quickmart_product?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:quickmart_app}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:host.docker.internal:9092}
spring.kafka.consumer.group-id=product-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
app.kafka.payment-completed-topic=${PAYMENT_COMPLETED_TOPIC:payment.completed}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.product-images.directory=${PRODUCT_IMAGE_DIRECTORY:uploads/products}
